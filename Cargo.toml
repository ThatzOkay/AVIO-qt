[package]
name = "avio_qt"
version = "0.1.0"
edition = "2024"

# Only inherited by the wradio-c100 crates (ported from omri-usb, hence LGPL), same as avio.
[workspace]

[workspace.package]
edition = "2021"
license = "LGPL-2.1-only"

[dependencies]
cpvc = "0.6.0"
material-colors = "0.5.0"
qtbridge = { version = "0.3.0", features = ["linkme", "serde_json"] }
regex = "1.13.1"
regex-split = "0.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
base64 = "0.22.1"
tokio = { version = "1.54.1", features = ["full"] }
gst-video = { path = "crates/gst-video" }
aa-proto = { path = "crates/aa-proto" }
prost = "0.14"
openssl = { version = "0.10", features = ["vendored"] }
rtl-sdr = { path = "crates/rtl-sdr" }
welle-io-sys = { path = "crates/welle-io-sys" }
wradio-c100-core = { path = "crates/wradio-c100-core" }
dirs = "7.0.0"
nusb = { version = "0.2.9", features = ["tokio"] }
futures-lite = "2.6.1"

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
brightness = "0.8"
futures = "0.3"
libpulse-binding = "2.30"

[target.'cfg(target_os = "linux")'.dependencies]
signal-hook = "0.4"
libc = "0.2"
# PulseAudio is Linux-only - Windows has its own WASAPI path (see
# `audio::set_default_device_windows`), it was never actually a Windows dependency.
libpulse-binding = "2.30"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-audio = "0.3.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.0", features = [
    "Win32_Media_Audio",
    "Win32_System_Com",
] }
# Must be the version `windows` itself uses: the `interface` macro expands to `windows_core::` paths
windows-core = "0.62"
