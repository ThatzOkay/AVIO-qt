# Tauri v2 denies any plugin command not explicitly permitted -- this is
# the allow-list every command in `src/commands.rs` needs an entry in.
# Identifiers are auto-generated by `build.rs` from each command's Rust
# name (snake_case -> `allow-<kebab-case>`, e.g. `start_scan` ->
# `allow-start-scan`).
"$schema" = "schemas/schema.json"

[default]
description = "Default permissions for the wradio-c100 plugin: USB device discovery/open, scanning, tuning, service selection, live snapshot, and presets."
permissions = [
    "allow-list-devices",
    "allow-open-device",
    "allow-start-scan",
    "allow-stop-scan",
    "allow-tune",
    "allow-start-service",
    "allow-stop-service",
    "allow-get-snapshot",
    "allow-list-presets",
    "allow-set-preset",
    "allow-clear-preset",
    "allow-list-stations",
    "allow-set-volume",
    "allow-mute",
]
